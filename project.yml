name: macos-remote

options:
  bundleIdPrefix: com.jeffhandley
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  generateEmptyDirectories: true

packages:
  MacOSRemote:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  macos-remote-macbook:
    type: application
    platform: macOS
    sources:
      - src/macos-remote-macbook
    dependencies:
      - package: MacOSRemote
    info:
      path: src/macos-remote-macbook/Info.plist
      properties:
        CFBundleDisplayName: macOS Remote
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: macOS Remote uses Bluetooth to receive input from a paired iPhone.
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: src/macos-remote-macbook/macos-remote-macbook.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffhandley.macos-remote.macbook
        PRODUCT_NAME: macOS Remote
        ENABLE_APP_SANDBOX: false
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  macos-remote-iphone:
    type: application
    platform: iOS
    sources:
      - src/macos-remote-iphone
    dependencies:
      - package: MacOSRemote
    info:
      path: src/macos-remote-iphone/Info.plist
      properties:
        CFBundleDisplayName: macOS Remote
        LSApplicationCategoryType: public.app-category.utilities
        NSBluetoothAlwaysUsageDescription: macOS Remote uses Bluetooth to discover and control nearby Macs.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: src/macos-remote-iphone/macos-remote-iphone.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffhandley.macos-remote.iphone
        PRODUCT_NAME: macOS Remote
        TARGETED_DEVICE_FAMILY: 1

schemes:
  macos-remote-macbook:
    build:
      targets:
        macos-remote-macbook: all
    run:
      config: Debug
  macos-remote-iphone:
    build:
      targets:
        macos-remote-iphone: all
    run:
      config: Debug
